name: demo-docs
on:
  workflow_dispatch:
jobs:
  package-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Public repositories can upload the static demo
        run: |
          echo "visibility=${{ github.event.repository.visibility }}"
          if [ "${{ github.event.repository.visibility }}" != "public" ]; then
            echo "This repository is not public."
            echo "GitHub Free cannot publish Pages from a private repository."
            echo "See docs/HOSTING.md. No site was published and visibility was not changed."
            exit 0
          fi
      - uses: actions/upload-artifact@v4
        if: github.event.repository.visibility == 'public'
        with:
          name: bitter-solenoid-docs
          path: docs/
